name: Snake-City CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Type-check frontend and backend
        run: npm run lint

      - name: Verify Service Worker syntax
        run: node --check public/sw.js

      - name: Run automated unit & security test suites
        run: npm test

      - name: Build production bundle
        run: npm run build
